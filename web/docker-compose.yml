name: 733-proj-web

services:
  frontend:
    build:
      context: frontend
    ports:
      - "3000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000"
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [ gpu ]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  ollama:
    build:
      dockerfile: ollama.Dockerfile
    ports:
      - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]